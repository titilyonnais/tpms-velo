# =====================================================================
# mosquitto.conf — Courtier MQTT de l'entrepôt (Mosquitto 2)
# ---------------------------------------------------------------------
# Un seul point d'entrée : le port 8883, en TLS, avec certificat client
# OBLIGATOIRE. Pas de port 1883 en clair, pas de connexion anonyme.
# =====================================================================

listener 8883 0.0.0.0
protocol mqtt

# TLS : le courtier présente SON certificat, signé par l'AC de l'usine...
certfile /certificats/courtier.pem
keyfile /certificats/courtier.cle
# ... et n'accepte que les clients qui présentent un certificat signé par
# cette même AC (authentification mutuelle).
cafile /certificats/ac.pem
require_certificate true
tls_version tlsv1.2

# Le nom inscrit dans le certificat (CN) devient l'identifiant de
# l'utilisateur : c'est lui que les droits (ACL) contrôlent.
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/acl

# Journal : connexions, refus, abonnements.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Messages retenus (état des passerelles) gardés en mémoire seulement.
persistence false
