# =====================================================================
# mosquitto.conf — Courtier MQTT de l'entrepôt (Mosquitto 2)
# ---------------------------------------------------------------------
# Un seul point d'entrée : le port 8883, en TLS, avec certificat client
# OBLIGATOIRE. Pas de port 1883 en clair, pas de connexion anonyme.
# =====================================================================

listener 8883 0.0.0.0
protocol mqtt

# TLS : le courtier présente SON certificat, signé par l'AC de l'usine...
certfile /certificats/courtier.pem
keyfile /certificats/courtier.cle
# ... et n'accepte que les clients qui présentent un certificat signé par
# cette même AC (authentification mutuelle).
cafile /certificats/ac.pem
require_certificate true
tls_version tlsv1.2
# Liste de révocation publiée par l'AC (generer-certificats.js) : un
# certificat volé, révoqué, est refusé même s'il est bien signé.
crlfile /certificats/crl.pem

# Le nom inscrit dans le certificat (CN) devient l'identifiant de
# l'utilisateur : c'est lui que les droits (ACL) contrôlent.
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/acl

# Journal : connexions, refus, abonnements.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Messages retenus (état des passerelles) gardés en mémoire seulement.
persistence false

# Limites contre l'inondation (S31) : un message ne dépasse pas 256 Kio
# (un lot de 10 s fait 1 à 20 Kio), 20 messages QoS 1 en vol par client,
# et 4 000 messages gardés pour un client absent (la supervision en
# session persistante : plus d'une heure de lots). Le reste est refusé.
max_packet_size 262144
max_inflight_messages 20
max_queued_messages 4000
