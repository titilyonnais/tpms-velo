# Réception des journaux du réseau (RFC 5424 sur UDP 514).
module(load="imudp")
input(type="imudp" port="514")
# Tout dans un seul fichier, avec l'adresse IP de l'émetteur.
template(name="ligne" type="string" string="%timegenerated:::date-rfc3339% %fromhost-ip% %app-name% %msg%\n")
*.* action(type="omfile" file="/journaux/central.log" template="ligne")
