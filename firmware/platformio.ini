; =====================================================================
; platformio.ini — Compilation avec PlatformIO (FACULTATIF)
; ---------------------------------------------------------------------
; La méthode conseillée est l'Arduino IDE (voir README.md).
;
; À VÉRIFIER : le Seeed XIAO nRF52840 n'est PAS une carte officielle de
; PlatformIO. On utilise une plateforme COMMUNAUTAIRE, maintenue par
; Maximilian Gerhardt, qui ajoute les cartes XIAO avec le cœur
; Adafruit/Seeed (celui de Bluefruit, pas la version mbed) :
;   https://github.com/maxgerhardt/platform-nordicnrf52
; Le nom exact de la carte est à vérifier dans le dossier "boards" de
; cette plateforme (xiaoble_adafruit pour le XIAO nRF52840 simple,
; xiaoblesense_adafruit pour la version Sense).
; =====================================================================

[platformio]
; Le programme est rangé comme un croquis Arduino : on indique à
; PlatformIO de compiler ce dossier (le .ino et tout le sous-dossier src/).
src_dir = tpms_boitier

[env:xiao_nrf52840]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
board = xiaoble_adafruit
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@^1.5.0
; Plots NFC utilisés comme broches ordinaires (le programme le fait aussi
; lui-même au premier démarrage, voir sorties.cpp).
build_flags =
    -DCONFIG_NFCT_PINS_AS_GPIOS
